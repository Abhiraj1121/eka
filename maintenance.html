<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Under Maintenance · EKA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23C9A84C'/><path d='M16 8 L18.2 13.8 L24 16 L18.2 18.2 L16 24 L13.8 18.2 L8 16 L13.8 13.8 Z' fill='%230C0608'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A84C; --gold-bright:#F0D080; --gold-dim:#8A6E30;
    --gold-glow:rgba(201,168,76,0.28); --gold-edge:rgba(201,168,76,0.16);
    --ink:#0C0608; --ink2:#130C10; --ink3:#1E1420;
    --surface:rgba(30,20,32,0.72); --surface-edge:rgba(255,255,255,0.06);
    --text:#EDE8E0; --text2:#A09880; --text3:#6A6050;
    --danger:#E05555;
    --font-display:'Cinzel',serif; --font-body:'Rajdhani',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; width:100%; background:var(--ink); font-family:var(--font-body); color:var(--text); -webkit-font-smoothing:antialiased; }
  body{
    display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:24px;
    position:relative; overflow-x:hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(201,168,76,0.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 110%, rgba(167,120,250,0.06), transparent 60%),
      linear-gradient(180deg, #08050A 0%, #0C0710 50%, #08050A 100%);
  }
  #bgCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  .stage{ position:relative; z-index:10; width:min(540px, 100%); }
  .card{
    position:relative; text-align:center; overflow:hidden;
    background:var(--surface); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--surface-edge); border-radius:26px; padding:52px 40px 40px;
    box-shadow:0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 1px 0 rgba(255,255,255,0.06) inset;
  }
  .card::before{
    content:''; position:absolute; inset:0; border-radius:26px; padding:1px;
    background:linear-gradient(135deg, var(--gold-edge), transparent 30%, transparent 70%, var(--gold-edge));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }

  /* Plug scene */
  .plug-wrap{ width:220px; height:110px; margin:0 auto 28px; position:relative; }
  .plug-wrap svg{ width:100%; height:100%; overflow:visible; }

  .prong-left{ animation:pullLeft 3.2s ease-in-out infinite; transform-origin:center; }
  .prong-right{ animation:pullRight 3.2s ease-in-out infinite; transform-origin:center; }
  @keyframes pullLeft{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-7px); } }
  @keyframes pullRight{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(7px); } }

  .spark{ animation:sparkFlicker 3.2s ease-in-out infinite; }
  .spark.s2{ animation-delay:0.15s; }
  .spark.s3{ animation-delay:0.3s; }
  @keyframes sparkFlicker{
    0%,38%,100%{ opacity:0; transform:scale(0.6); }
    46%{ opacity:1; transform:scale(1.15); }
    54%{ opacity:0.3; transform:scale(0.9); }
    60%{ opacity:0; transform:scale(0.6); }
  }

  .gap-glow{ animation:gapPulse 3.2s ease-in-out infinite; }
  @keyframes gapPulse{ 0%,40%,100%{ opacity:0.15; } 50%{ opacity:0.55; } }

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--gold); opacity:0.85; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--danger); box-shadow:0 0 8px var(--danger); animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }

  h1.code{
    font-family:var(--font-display); font-weight:800; font-size:38px; letter-spacing:0.04em;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--gold-dim));
    -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.25; margin-bottom:12px;
  }
  p.body-text{ font-size:15px; line-height:1.65; color:var(--text2); font-weight:500; max-width:400px; margin:0 auto 30px; }

  .status-row{
    display:inline-flex; align-items:center; gap:8px; margin:0 auto 30px;
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.05em; color:var(--text3);
    background:rgba(0,0,0,0.25); border:1px solid var(--surface-edge); border-radius:999px; padding:8px 16px 8px 12px;
  }
  .status-row .pulse-dot{
    width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold-glow);
    animation:blink 1.6s ease-in-out infinite;
  }

  .actions{ display:flex; flex-direction:column; gap:12px; align-items:center; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--font-body); font-weight:700; font-size:14.5px; letter-spacing:0.02em;
    padding:12px 30px; border-radius:999px; cursor:pointer; text-decoration:none; border:none;
    transition:transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  .btn-solid{ background:linear-gradient(135deg, var(--gold-bright), var(--gold) 60%, var(--gold-dim)); color:var(--ink); }
  .btn-solid:hover{ box-shadow:0 10px 26px var(--gold-glow); transform:translateY(-1px); }
  .btn-solid:active{ transform:translateY(0px) scale(0.98); }
  .btn-solid.is-loading svg{ animation:rotate 0.8s linear infinite; }
  @keyframes rotate{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

  footer.note{
    margin-top:26px; padding-top:18px; border-top:1px solid var(--surface-edge);
    font-family:var(--font-mono); font-size:10.5px; color:var(--text3); letter-spacing:0.06em;
  }

  @media (max-width:480px){
    .card{ padding:40px 24px 32px; border-radius:20px; }
    h1.code{ font-size:28px; }
    .plug-wrap{ width:180px; height:92px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="stage">
  <div class="card">

    <div class="plug-wrap">
      <svg viewBox="0 0 220 110" xmlns="http://www.w3.org/2000/svg">
        <!-- gap glow -->
        <ellipse class="gap-glow" cx="110" cy="55" rx="30" ry="16" fill="rgba(201,168,76,0.35)" />

        <!-- Left cable + plug -->
        <g class="prong-left">
          <path d="M0 55 C 30 55, 40 40, 60 40" stroke="#3A2E20" stroke-width="10" stroke-linecap="round" fill="none"/>
          <path d="M0 55 C 30 55, 40 40, 60 40" stroke="#5A4830" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
          <rect x="55" y="28" width="30" height="24" rx="6" fill="url(#plugBody)" stroke="var(--gold-dim)" stroke-width="1.5"/>
          <rect x="80" y="34" width="12" height="5" rx="2" fill="var(--gold-bright)"/>
          <rect x="80" y="43" width="12" height="5" rx="2" fill="var(--gold-bright)"/>
        </g>

        <!-- Right cable + socket -->
        <g class="prong-right">
          <path d="M220 55 C 190 55, 180 65, 160 65" stroke="#241922" stroke-width="12" stroke-linecap="round" fill="none"/>
          <path d="M220 55 C 190 55, 180 65, 160 65" stroke="#382636" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>
          <rect x="130" y="50" width="32" height="30" rx="7" fill="url(#socketBody)" stroke="var(--gold-edge)" stroke-width="1.5"/>
          <rect x="136" y="58" width="8" height="6" rx="2" fill="#0C0608"/>
          <rect x="149" y="58" width="8" height="6" rx="2" fill="#0C0608"/>
        </g>

        <!-- sparks in the gap -->
        <g stroke="var(--gold-bright)" stroke-width="2" stroke-linecap="round">
          <path class="spark s1" d="M100 46 L108 40 M108 40 L104 50 M104 50 L112 46"/>
          <path class="spark s2" d="M118 62 L112 56 M112 56 L120 58 M120 58 L114 66"/>
          <path class="spark s3" d="M106 60 L98 58"/>
        </g>

        <defs>
          <linearGradient id="plugBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2A2018"/>
            <stop offset="1" stop-color="#171008"/>
          </linearGradient>
          <linearGradient id="socketBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#241A28"/>
            <stop offset="1" stop-color="#140E18"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="eyebrow"><span class="dot"></span> Connection interrupted</div>

    <h1 class="code">EKA is offline for maintenance</h1>
    <p class="body-text">
      We're tuning things up behind the scenes. EKA has stepped away from the socket for a moment —
      hang tight, we're plugging it back in.
    </p>

    <div class="status-row">
      <span class="pulse-dot"></span>
      Reconnecting is out of our hands right now — try again shortly
    </div>

    <div class="actions">
      <button class="btn btn-solid" id="reloadBtn" type="button" onclick="reloadPage()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span id="reloadLabel">Try Again</span>
      </button>
    </div>

    <footer class="note">EKA AI · Scheduled Maintenance</footer>
  </div>
</div>

<script>
  function reloadPage(){
    const btn = document.getElementById('reloadBtn');
    const label = document.getElementById('reloadLabel');
    btn.classList.add('is-loading');
    label.textContent = 'Reconnecting…';
    btn.disabled = true;
    setTimeout(() => { window.location.reload(); }, 550);
  }

  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles;
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  function initParticles(){
    const count = Math.min(90, Math.floor((w*h)/16000));
    particles = Array.from({length: count}, () => ({
      x: Math.random()*w, y: Math.random()*h, z: Math.random()*1 + 0.2,
      r: Math.random()*1.6 + 0.4, vy: (Math.random()*0.15 + 0.03), tw: Math.random()*Math.PI*2
    }));
  }
  initParticles();
  window.addEventListener('resize', initParticles);
  function drawParticles(){
    ctx.clearRect(0,0,w,h);
    for(const p of particles){
      p.tw += 0.02;
      const alpha = 0.25 + Math.abs(Math.sin(p.tw))*0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*p.z, 0, Math.PI*2);
      ctx.fillStyle = `rgba(201,168,76,${alpha*p.z})`; ctx.fill();
      p.y -= p.vy;
      if(p.y < -5){ p.y = h+5; p.x = Math.random()*w; }
    }
    requestAnimationFrame(drawParticles);
  }
  drawParticles();
</script>

</body>
</html>
